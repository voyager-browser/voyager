name: Pages

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Validate HTML, CSS, and JS
        run: npm run validate
